name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (go build / vet / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Build
        run: go build ./cmd/... ./internal/... ./tests/...
      - name: Vet
        run: go vet ./internal/... ./tests/...
      - name: Test
        run: go test ./internal/... ./tests/... -count=1

  frontend:
    name: frontend (type check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run type-check
