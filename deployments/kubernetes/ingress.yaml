apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opsagent
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - opsagent.example.com
    secretName: opsagent-tls
  rules:
  - host: opsagent.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opsagent
            port:
              number: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opsagent-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opsagent
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opsagent-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: opsagent
