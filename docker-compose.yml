version: '3.8'

services:
  opsagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: opsagent:latest
    container_name: opsagent
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - OPSAGENT_ENVIRONMENT=production
      - OPSAGENT_HOST=0.0.0.0
      - OPSAGENT_PORT=8080
      - OPSAGENT_LOG_LEVEL=info
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - opsagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:latest
    container_name: opsagent-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - opsagent-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: opsagent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./deployments/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployments/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - opsagent-network
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  opsagent-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
